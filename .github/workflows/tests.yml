name: Python validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cloud:
    name: Debian 11 / Python 3.12
    runs-on: ubuntu-latest
    container: python:3.12-slim-bullseye
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: >-
          python -m pip install --only-binary=:all: -r requirements.txt
      - run: python -m pip check
      - run: python Project01.py
      - run: python -m unittest discover -s tests -v
      - name: Start Streamlit and check health
        run: |
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --browser.gatherUsageStats false > streamlit.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if python -c 'from urllib.request import urlopen; assert urlopen("http://127.0.0.1:8501/_stcore/health", timeout=2).read().strip() == b"ok"' 2>/dev/null; then
              echo "Streamlit startup verified"
              exit 0
            fi
            sleep 1
          done
          cat streamlit.log
          exit 1
  windows:
    name: Windows / Python 3.12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python Project01.py
      - run: python -m unittest discover -s tests -v
